name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://art_auction:art_auction@localhost:5432/art_auction
      # Integration and e2e tests create and migrate this database themselves.
      TEST_DATABASE_URL: postgres://art_auction:art_auction@localhost:5432/art_auction_test
      # The Socket.IO Redis adapter; one integration test runs two API instances against it.
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://art_auction:art_auction@localhost:5672
      # Tests never reach the network: no Jaeger in CI.
      OTEL_SDK_DISABLED: 'true'

    services:
      postgres:
        # Same image as docker-compose.yml, so pgvector is available when phase 8 needs it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: art_auction
          POSTGRES_PASSWORD: art_auction
          POSTGRES_DB: art_auction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U art_auction -d art_auction"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        # Same image as docker-compose.yml.
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        # Same image as docker-compose.yml.
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: art_auction
          RABBITMQ_DEFAULT_PASS: art_auction
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Typecheck (server and web)
        run: npm run typecheck

      - name: Unit tests (server)
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Web tests
        run: npm run test:web

      - name: Build web
        run: npm run build -w web
